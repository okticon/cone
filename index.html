<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     /* 이서윤체 폰트 적용을 위한 코드 */
     @font-face {
        font-family: "LeeSeoyun";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/LeeSeoyun.woff")
          format("woff");
        font-weight: normal;
        font-style: normal;
      }

      /* body태그 자체에 css 요소 부여 */
        body {
	        font-family: "LeeSeoyun";
	        margin: 0;
	        display: flex;
	        justify-content: center;
	        background-image: url("./background.png");
        }

        .container {
            width: 390px;
            background-color: #ff9d73;
            height: 100%;
        }

        .photos {
            margin-top: 30px;
        }

        .photo-frame {
            background-color: white;
            margin: 15px 20px;
            height: 200px;

            background-size: cover;
            position: relative;

            cursor: pointer;
        }

        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .f-title {
            color: white;
            font-size: 25px;
            font-weight: 900;
        }

        .f-date {
            color: white;
            font-size: 15px;
            font-weight: 500;
        }

        #image1 {
            background-image: url('./img1.png');
        }

        #image2 {
            background-image: url('./img2.png');
        }

        #image3 {
            background-image: url('./img3.png');
        }

        #image4 {
            background-image: url('./img4.png');
        }

        .photo_description {
            color: white;
            background-color: black;

            width: fit-content;
            padding: 0 20px;
            margin-bottom: 10px;

            border-radius: 10px;
            position: absolute;
            bottom: 0;

            transform: translate(-50%);
            left: 50%;

            opacity: 0;
        }

        .video {
            width: 100%;
            height: 100%;
        }

        .showText {
            opacity: 0;
        }

        .hideText {
            opacity: 1;
            transition: opacity 0.5s linear;
        }
        </style>
        <script>
            // 텍스트가 보여지는 기능
            // 1. 몇 번째 사진에 마우스가 올라갔는지 확인(if문)
            // 2. 해당 사진을 찾아 hideText class를 지워주고, showText는 삽입해줌
            function showText(number) {
                if (number === 1) {
                    document.querySelector("#desc1").classList.remove("hideText");
                    document.querySelector("#desc1").classList.add("showText");
                } else if (number === 2) {
                    document.querySelector("#desc2").classList.remove("hideText");
                    document.querySelector("#desc2").classList.add("showText");
                } else {
                    document.querySelector("#desc3").classList.remove("hideText");
                    document.querySelector("#desc3").classList.add("showText");
                }
            }

            // 텍스트가 감춰지는 기능
            // 1. 몇 번째 사진에서 마우스가 벗어났는지 확인(if문)
            // 2. 해당 사진을 찾아 shotText class를 지워주고, hideText는 삽입해줌
            function hideText(number) {
                if (number === 1) {
                    document.querySelector("#desc1").classList.remove("showText");
                    document.querySelector("#desc1").classList.add("hideText");
                } else if (number === 2) {
                    document.querySelector("#desc2").classList.remove("showText");
                    document.querySelector("#desc2").classList.add("hideText");
                } else {
                    document.querySelector("#desc3").classList.remove("showText");
                    document.querySelector("#desc3").classList.add("hideText");
                }
            }

            // 클릭 기능
            // 1. 선택된 사진의 숫자를 가진 텍스트를 alert 형태로 출력해줌
            function alertText(number) {
                alert(`${number}번째 추억이에요! 눌러주셔서 감사합니다 :)`);
            }

            // 구글 드라이브 사진 연동
            // 1. 드라이브에서 사진 공유를 '링크가 있는 모든 사용자'로 바꾸고 링크를 복사
            // 2. 아래 driveImages에 사진 순서대로 링크(또는 파일 ID)를 붙여넣기
            // 3. 비워두거나 불러오기에 실패하면 저장소의 img 파일이 그대로 보여짐
            const driveImages = {
                image1: "",
                image2: "",
                image3: "",
            };

            // 공유 링크에서 파일 ID만 뽑아냄 (ID만 넣어도 동작)
            function getDriveId(link) {
                const match = link.match(/\/d\/([\w-]+)/) || link.match(/[?&]id=([\w-]+)/);
                return match ? match[1] : link.trim();
            }

            // 사진을 미리 불러와 보고, 성공했을 때만 배경으로 바꿔줌
            function loadDriveImages() {
                for (const [elementId, link] of Object.entries(driveImages)) {
                    if (!link) continue;
                    const url = `https://drive.google.com/thumbnail?id=${getDriveId(link)}&sz=w1000`;
                    const img = new Image();
                    img.onload = () => {
                        document.getElementById(elementId).style.backgroundImage = `url("${url}")`;
                    };
                    img.src = url;
                }
            }

            document.addEventListener("DOMContentLoaded", loadDriveImages);
        </script>
</head>
<body>
    <div class="container">
        <div class="photos">
            <div id="image1" class="photo-frame"
                onmouseover="hideText(1)"
                onmouseout="showText(1)"
                onclick="alertText(1)"
                >
                <span id="desc1" class="photo_description">
                    첫번 째 사진
                </span>
            </div>
                <div id="image2" class="photo-frame"
                onmouseover="hideText(2)"
                onmouseout="showText(2)"
                onclick="alertText(2)"
                >
                <span id="desc2" class="photo_description">
                    두번 째 사진
                </span>
            </div>
                <div id="image3" class="photo-frame"
                onmouseover="hideText(3)"
                onmouseout="showText(3)"
                onclick="alertText(3)"
                >
                <span id="desc3" class="photo_description">
                    세번 째 사진
                </span>
            </div>
                <!-- src : source, 즉 자료의 원천이 어디있는지를 의미해요! -->
            <div class="photo-frame">
                    <iframe
                        src="https://www.youtube.com/embed/9zO_iknOCFE"
                    frameborder="0"
                    class="video"
                    ></iframe>
            </div>
        </div>
    
        <div class="footer">
            <p class="f-title">Happy Lunch Time</p>
            <p class="f-date">2023.02.03</p>
        </div>
    </div>
</body>
</html>
